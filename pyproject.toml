[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognosieve-umbra"
version = "0.1.0"
description = "Find the AI nobody told you about, prove what is exposed, and show exactly how to fix it."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CognoSieve Umbra Contributors" }
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
]

[project.scripts]
umbra = "umbra.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["umbra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
