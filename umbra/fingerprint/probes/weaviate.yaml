name: weaviate
category: vector-db
default_ports: [8080]
requests:
  - method: GET
    path: /v1/meta
    match_all:
      - status: 200
      - json_path_exists: "version"
      - body_contains: "weaviate"
    extract:
      version: "version"
auth_check_path: /v1/schema
capability_flags: ["vector_graph", "hybrid_search"]
specificity: 90
status: active
verify_note: "https://weaviate.io/developers/weaviate/api/rest#meta"

